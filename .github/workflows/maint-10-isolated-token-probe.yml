name: MAINT-10 isolated token probe
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'maintenance/issue10-token-probe-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create restricted publisher installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MARS_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.MARS_PUBLISHER_PRIVATE_KEY }}
          permission-contents: read
          skip-token-revoke: false
      - name: Verify app identity and repository scope via GET
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SLUG" = mars-completed-meta-publisher
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          gh api --method GET /installation/repositories --jq '.repositories | map(.full_name)' | jq -e --arg repo "$GITHUB_REPOSITORY" '. == [$repo]' >/dev/null
          gh api --method GET "/repos/$GITHUB_REPOSITORY/branches/main" --jq '.name == "main"' | grep -qx true
          printf 'PASS: app=%s installation=%s repository=%s; GET main succeeded\n' "$APP_SLUG" "$INSTALLATION_ID" "$GITHUB_REPOSITORY"
