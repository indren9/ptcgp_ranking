name: R3.3 portable Windows observer QA

on:
  pull_request:
    paths:
      - "tooling/historical_observer/**"
      - ".github/workflows/r33-observer-lifecycle-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    name: Windows observer lifecycle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          & "tooling/historical_observer/tests/test_windows_lifecycle.ps1"
          & "tooling/historical_observer/tests/test_preview_portability.ps1"
          & "tooling/historical_observer/tests/test_controlled_termination.ps1"
      - name: PowerShell 7
        shell: pwsh
        run: |
          & "tooling/historical_observer/tests/test_windows_lifecycle.ps1"
          & "tooling/historical_observer/tests/test_preview_portability.ps1"
          & "tooling/historical_observer/tests/test_controlled_termination.ps1"