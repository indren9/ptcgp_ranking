name: Update public expansion catalog

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-expansion-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.2.1 selenium==4.22.0

      - name: Fetch and publish catalog
        run: python -m scripts.export_expansions_catalog

      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- public/expansions_pocket_standard.csv; then
            echo "Expansion catalog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/expansions_pocket_standard.csv
          git commit -m "chore(data): update Pocket expansion catalog"
          git push
